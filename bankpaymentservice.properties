spring.application.name=bankpaymentservice
server.port=8100

spring.datasource.url=jdbc:postgresql://localhost:5432/bankpaymentdb
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

paymentSecretKey=gatewayPaymentSecretKey
paymentInternalSecretKey=paymentInternalSecretKey
interServiceSecretKey=interServiceSecretKey

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=banking-system-simulator-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.tejas.bankingcommon.dto.TransactionEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

payment.callbackUrl.TPay=""

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false